# Add/replace these entries in your existing secrets.yaml.
# Each Shelly URL ends with &value=; ESPHome appends the action/battery value.
# Panel 1 (X1i)
shelly_panel1_action_url: 'http://192.168.68.118/rpc/Text.Set?id=200&value='
shelly_panel1_battery_url: 'http://192.168.68.118/rpc/Number.Set?id=200&value='

# Panel 2: replace IP and component ID with the real values.
shelly_panel2_action_url: 'http://192.168.68.xxx/rpc/Text.Set?id=200&value='

# Keep all other secrets (wifi, OTA, LOQED URLs, esphome_build_path) unchanged.
# The old shelly_panel1_ip and shelly_panel2_ip secrets are no longer used here.
