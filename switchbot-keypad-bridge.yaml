esphome:
  name: switchbot-keypad-bridge
  build_path: !secret esphome_build_path

substitutions:
  # Complete Shelly RPC URL prefixes, including component IDs.
  # The event value is appended at runtime.
  shelly_panel1_action_url: !secret shelly_panel1_action_url
  shelly_panel2_action_url: !secret shelly_panel2_action_url
  shelly_panel1_battery_url: !secret shelly_panel1_battery_url
  loqed_garage_night_lock_url: !secret loqed_garage_night_lock_url
  loqed_garage_latch_url: !secret loqed_garage_latch_url

http_request:
  timeout: 3s

globals:
  - id: keypad_action_seq
    type: uint32_t
    restore_value: no
    initial_value: '0'

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf


psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: components
    components: [switchbot_keypad_bridge]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG

api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

# TLS in the setup wizard needs a valid system clock; SNTP keeps it set
# even before Home Assistant connects.
time:
  - platform: sntp

# Programmable RGB LED on this ESP32-S3-N16R8 board: WS2812, GPIO48.
# The three small PWR/TX/RX LEDs are hardware indicators, not spare GPIOs.
light:
  - platform: esp32_rmt_led_strip
    id: activity_led
    pin: GPIO48
    num_leds: 1
    chipset: ws2812
    rgb_order: GRB
    internal: true
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

script:
  # Sequentially send HTTP requests to the destinations in an array.
  # Keep LOQED first so panel timeouts cannot delay the lock command.
  - id: send_urls
    mode: queued
    max_runs: 10
    parameters:
      urls: string[]
    then:
      - repeat:
          count: !lambda 'return static_cast<int>(urls.size());'
          then:
            - http_request.get:
                url: !lambda 'return urls[iteration];'
                on_response:
                  then:
                    - logger.log:
                        format: "Keypad dispatch HTTP %d"
                        args: [response->status_code]
                on_error:
                  then:
                    - logger.log: "Keypad dispatch HTTP request failed"

  # One actual lock destination: Garage LOQED Pure.
  # Two display destinations: the Shelly panels' Text virtual components.
  # This does NOT invoke either panel's Boolean lock toggle.
  - id: lock_all
    then:
      - lambda: |-
          const unsigned long seq = (unsigned long) ++id(keypad_action_seq);
          const std::string value = str_sprintf("L%lu", seq);
          id(send_urls)->execute(std::vector<std::string>{
            "${loqed_garage_night_lock_url}",
            std::string("${shelly_panel1_action_url}") + value,
            std::string("${shelly_panel2_action_url}") + value
          });

  - id: unlock_all
    parameters:
      method: string
      index: int
    then:
      - lambda: |-
          const char *m =
            method == "face" ? "F" :
            method == "fingerprint" ? "FP" :
            method == "pin" ? "P" :
            method == "palm" ? "PA" :
            method == "nfc" ? "N" : "U";
          const unsigned long seq = (unsigned long) ++id(keypad_action_seq);
          const std::string value = str_sprintf("%s%d-%lu", m, index, seq);
          std::vector<std::string> urls;
          // Only recognized credential types may operate the physical lock.
          if (method == "face" || method == "fingerprint" || method == "pin" ||
              method == "palm" || method == "nfc") {
            urls.push_back("${loqed_garage_latch_url}");
          }
          urls.push_back(std::string("${shelly_panel1_action_url}") + value);
          urls.push_back(std::string("${shelly_panel2_action_url}") + value);
          id(send_urls)->execute(urls);

  - id: report_doorbell
    then:
      - lambda: |-
          const unsigned long seq = (unsigned long) ++id(keypad_action_seq);
          const std::string value = str_sprintf("B%lu", seq);
          id(send_urls)->execute(std::vector<std::string>{
            std::string("${shelly_panel1_action_url}") + value,
            std::string("${shelly_panel2_action_url}") + value
          });

  - id: flash_activity
    mode: restart
    parameters:
      red: float
      green: float
      blue: float
    then:
      - light.turn_on:
          id: activity_led
          red: !lambda 'return red;'
          green: !lambda 'return green;'
          blue: !lambda 'return blue;'
          brightness: 75%
      - delay: 2s
      - light.turn_off: activity_led

mdns:
  disabled: false
  services:
    - service: "_sbkeypad"
      protocol: "_tcp"
      port: 8080
      txt:
        model: "KeypadVisionPro"
        keypad_mac: "B0E9FEEA3ABC"
        status_path: "/api/status"
        bridge: "ESPHome"

switchbot_keypad_bridge:
  id: keypad_bridge
  # Rearm Keypad Vision's passive face/palm unlock after each unlock.
  # Default: 20s. Set 0s to rearm only on confirmed lock/door closure.
  rearm_after: 20s

  keypad_action:
    name: "Action"

  keypad:
    name: "Keypad"

  linked_lock:
    name: "Lock"

  # Keypad and linked lock battery are read from BLE advertisements by the
  # shared background scan below.
  keypad_battery_level:
    name: "Keypad battery"
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !std::isnan(x);'
            then:
              - http_request.get:
                  url: !lambda |-
                    return std::string("${shelly_panel1_battery_url}") +
                           str_sprintf("%.0f", x);
                  on_error:
                    then:
                      - logger.log: "Shelly keypad battery update failed"

  lock_battery_level:
    name: "Lock battery"
  battery_scan_interval: 1min

  reset_button:
    name: "Reset"

  # Events notify both panels; only recognized keypad lock/unlock events
  # operate the Garage LOQED Pure directly.
  on_status_poll:
  - if:
      condition:
        not:
          script.is_running: flash_activity
      then:
        - script.execute:
            id: flash_activity
            red: 0.0
            green: 0.0
            blue: 1.0

  on_unlock:
    - script.execute:
        id: flash_activity
        red: 0.0
        green: 1.0
        blue: 0.0
    # Yield so the WS2812 update reaches the hardware before blocking HTTP.
    - delay: 30ms
    - script.execute:
        id: unlock_all
        method: !lambda 'return method;'
        index: !lambda 'return index;'

  on_lock:
    - script.execute:
        id: flash_activity
        red: 1.0
        green: 0.0
        blue: 0.0
    - delay: 30ms
    - script.execute: lock_all

  on_doorbell:
    - script.execute:
        id: flash_activity
        red: 1.0
        green: 0.0
        blue: 1.0
    - delay: 30ms
    - script.execute: report_doorbell

# Optional button to manually rearm face/palm unlock using the same action.
# button:
#   - platform: template
#     name: "Rearm keypad"
#     icon: mdi:lock-check
#     on_press:
#       - switchbot_keypad_bridge.rearm: keypad_bridge
