esphome:
  name: switchbot-keypad-bridge
  build_path: C:/My/Temp/HS_Build/ESPHome/SwitchBotKeypadBridgeGit

substitutions:
  shelly_ip: "192.168.68.118"

http_request:
  timeout: 3s

globals:
  - id: keypad_action_seq
    type: uint32_t
    restore_value: no
    initial_value: '0'

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf


psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: local
      path: components
    components: [switchbot_keypad_bridge]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG

api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

# TLS in the setup wizard needs a valid system clock; SNTP keeps it set
# even before Home Assistant connects.
time:
  - platform: sntp

# Programmable RGB LED on this ESP32-S3-N16R8 board: WS2812, GPIO48.
# The three small PWR/TX/RX LEDs are hardware indicators, not spare GPIOs.
light:
  - platform: esp32_rmt_led_strip
    id: activity_led
    pin: GPIO48
    num_leds: 1
    chipset: ws2812
    rgb_order: GRB
    internal: true
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

script:
  - id: flash_activity
    mode: restart
    parameters:
      red: float
      green: float
      blue: float
    then:
      - light.turn_on:
          id: activity_led
          red: !lambda 'return red;'
          green: !lambda 'return green;'
          blue: !lambda 'return blue;'
          brightness: 75%
      - delay: 1s
      - light.turn_off: activity_led

switchbot_keypad_bridge:
  id: keypad_bridge
  # Rearm Keypad Vision's passive face/palm unlock after each unlock.
  # Default: 20s. Set 0s to rearm only on confirmed lock/door closure.
  rearm_after: 20s

  keypad_action:
    name: "Action"

  keypad:
    name: "Keypad"

  linked_lock:
    name: "Lock"

  # Keypad and linked lock battery are read from BLE advertisements by the
  # shared background scan below.
  keypad_battery_level:
    name: "Keypad battery"
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !std::isnan(x);'
            then:
              - http_request.get:
                  url: !lambda |-
                    return str_sprintf(
                      "http://${shelly_ip}/rpc/Number.Set?id=200&value=%.0f", x
                    );
                  on_error:
                    then:
                      - logger.log: "Shelly keypad battery update failed"

  lock_battery_level:
    name: "Lock battery"
  battery_scan_interval: 1min

  reset_button:
    name: "Reset"

  # Each action increments a counter so repeated presses update the display.
  # These requests only update virtual components; they do not control a lock.
  # Light blue briefly when Shelly requests /api/status.
  on_status_poll:
    - script.execute:
        id: flash_activity
        red: 0.0
        green: 0.0
        blue: 1.0

  on_unlock:
    # method: pin | fingerprint | nfc | face | palm; index: credential slot
    - script.execute:
        id: flash_activity
        red: 0.0
        green: 1.0
        blue: 0.0
    - http_request.get:
        url: !lambda |-
          return str_sprintf(
            "http://${shelly_ip}/rpc/Text.Set?id=200&value=%%22%s%%20%%23%d%%20(%lu)%%22",
            method.c_str(), index, (unsigned long) ++id(keypad_action_seq)
          );
        on_error:
          then:
            - logger.log: "Shelly keypad unlock event update failed"

  on_lock:
    - script.execute:
        id: flash_activity
        red: 1.0
        green: 0.0
        blue: 0.0
    - http_request.get:
        url: !lambda |-
          return str_sprintf(
            "http://${shelly_ip}/rpc/Text.Set?id=200&value=%%22Lock%%20(%lu)%%22",
            (unsigned long) ++id(keypad_action_seq)
          );
        on_error:
          then:
            - logger.log: "Shelly keypad lock event update failed"

  on_doorbell:
    - script.execute:
        id: flash_activity
        red: 1.0
        green: 0.0
        blue: 1.0
    - http_request.get:
        url: !lambda |-
          return str_sprintf(
            "http://${shelly_ip}/rpc/Text.Set?id=200&value=%%22Doorbell%%20(%lu)%%22",
            (unsigned long) ++id(keypad_action_seq)
          );
        on_error:
          then:
            - logger.log: "Shelly keypad doorbell update failed"

# Optional button to manually rearm face/palm unlock using the same action.
